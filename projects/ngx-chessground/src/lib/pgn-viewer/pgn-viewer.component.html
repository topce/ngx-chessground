<div class="pgn-viewer-container">
  <div
    class="main-content"
    #mainContent
    [style.--left-panel-w.px]="leftPanelWidth()"
    [style.--right-panel-w.px]="rightPanelWidth()"
    (document:mousemove)="onResizeMove($event)"
    (document:mouseup)="stopResize()"
  >
    <!-- Left Panel: Game Filter & Browser -->
    <div class="panel left-panel">
      <game-filter-panel
        [(filterWhite)]="filterWhite"
        [(filterBlack)]="filterBlack"
        [(ignoreColor)]="ignoreColor"
        [uniqueWhitePlayers]="uniqueWhitePlayers()"
        [uniqueBlackPlayers]="uniqueBlackPlayers()"
        [(filterResult)]="filterResult"
        [(filterEco)]="filterEco"
        [(filterTimeControl)]="filterTimeControl"
        [(filterEvent)]="filterEvent"
        [(filterBroadcastName)]="filterBroadcastName"
        [sortedEcoCodes]="sortedEcoCodes()"
        [sortedTimeControls]="sortedTimeControls()"
        [sortedEvents]="sortedEvents()"
        [sortedBroadcastNames]="sortedBroadcastNames()"
        [(filterUpsetEnabled)]="filterUpsetEnabled"
        [(filterUpsetWin)]="filterUpsetWin"
        [(filterUpsetDraw)]="filterUpsetDraw"
        [(filterUpsetMinDiff)]="filterUpsetMinDiff"
        [(filterRatingEnabled)]="filterRatingEnabled"
        [(filterWhiteRating)]="filterWhiteRating"
        [(filterBlackRating)]="filterBlackRating"
        [(filterWhiteRatingMax)]="filterWhiteRatingMax"
        [(filterBlackRatingMax)]="filterBlackRatingMax"
        [(filterMoves)]="filterMoves"
        [(filterByFenEnabled)]="filterByFenEnabled"
        [(filterFen)]="filterFen"
        [(sortAscending)]="sortAscending"
        [gamesMetadata]="gamesMetadata()"
        [filteredGameInfos]="filteredGameInfos()"
        [totalFilteredCount]="totalFilteredCount()"
        [isFiltering]="isFiltering()"
        [currentGameIndex]="currentGameIndex()"
        [selectedGamesCount]="selectedGamesCount()"
        [canGoPrev]="canGoPrev()"
        [canGoNext]="canGoNext()"
        [currentWhitePlayer]="currentWhitePlayer()"
        [currentBlackPlayer]="currentBlackPlayer()"
        [currentGameResult]="currentGameResult()"
        [getOpeningMoves]="getOpeningMoves"
        (applyFilter)="applyFilter()"
        (clearFilters)="clearFilters()"
        (loadGame)="loadGame($event)"
        (toggleGameSelection)="toggleGameSelection($event)"
        (prevGame)="prevGame()"
        (nextGame)="nextGame()"
        (toggleSortDirection)="toggleSortDirection()"
        (snapshotCurrentPosition)="snapshotCurrentPosition()"
      />
    </div>

    <!-- Resize Handle -->
    <div
      class="resize-handle"
      (mousedown)="startResize('left', $event)"
      aria-hidden="true"
    ></div>

    <!-- Center Panel: Board -->
    <div class="panel center-panel">
      <board-display
        [runFunction]="runFunction()"
        [config]="boardConfig()"
        [(flipped)]="flipped"
        [(in3d)]="in3d"
        [topPlayerName]="topPlayerName()"
        [bottomPlayerName]="bottomPlayerName()"
        [topPlayerTurnClass]="topPlayerTurnClass()"
        [bottomPlayerTurnClass]="bottomPlayerTurnClass()"
        [activeColor]="activeColor()"
        [topPlayerActiveColor]="topPlayerActiveColor()"
        [bottomPlayerActiveColor]="bottomPlayerActiveColor()"
        [topPlayerTitle]="topPlayerTitle()"
        [bottomPlayerTitle]="bottomPlayerTitle()"
        [topTimeRemaining]="topTimeRemaining()"
        [bottomTimeRemaining]="bottomTimeRemaining()"
        [gameResult]="displayGameResult()"
        [evaluation]="boardEvaluation()"
        [currentMoveIndex]="currentMoveIndex()"
        [movesCount]="moves().length"
        [isAnalyzing]="isAnalyzing()"
        [bestMoveInfo]="bestMoveInfo()"
        [analysisVisible]="analysisVisible()"
        [showBetterMoveBtn]="showBetterMoveBtn()"
        [isEndOfReplay]="isEndOfReplay()"
        [hasNextAlternative]="currentAlternativeIndex() < allAlternatives().length - 1"
        [hasPrevAlternative]="currentAlternativeIndex() > 0"
        [alternativeLabel]="allAlternatives().length > 1 ? (currentAlternativeIndex() + 1) + '/' + allAlternatives().length : ''"
        [autoplayCompleted]="autoplayCompleted()"
        [practiceAvailable]="practiceAvailable()"
        [practiceActive]="practiceMode()"
        [(stockfishDepth)]="stockfishDepth"
        (flipBoard)="flipBoard()"
        (toggle3d)="toggle3d()"
        (goToStart)="start()"
        (prev)="prev()"
        (next)="next()"
        (end)="end()"
        (analyzePosition)="analyzePosition($event)"
        (autoplayBestLine)="autoplayBestLine()"
        (previewPvMove)="previewPvMove($event)"
        (toggleAnalysis)="toggleAnalysis()"
        (nextBestMove)="nextBestMove()"
        (prevBestMove)="prevBestMove()"
        (reevaluate)="reevaluatePosition()"
        (startPractice)="startPractice()"
      />

      @if (practiceMode()) {
        <practice-panel
          [isAnalyzing]="isAnalyzing()"
          [evaluation]="practiceEvaluation()"
          [bestMoveInfo]="bestMoveInfo()"
          [moves]="practiceMoves()"
          [fen]="currentFen()"
          [result]="practiceResult()"
          [sideToMove]="activeColor()"
          [(depth)]="stockfishDepth"
          (exit)="exitPractice()"
          (undoMove)="undoPracticeMove()"
          (restart)="restartPractice()"
          (reanalyze)="reanalyzePracticePosition()"
          (copyFen)="copyPracticeFen()"
          (copyMoves)="copyPracticeMoves()"
          (copyPgn)="copyPracticePgn()"
          (downloadPgn)="downloadPracticePgn()"
        />
      }
    </div>

    <!-- Resize Handle -->
    <div
      class="resize-handle"
      (mousedown)="startResize('right', $event)"
      aria-hidden="true"
    ></div>

    <!-- Right Panel: Moves, Replay, Load & Cache -->
    <div class="panel right-panel">
      <!-- Move List -->
      <div class="collapsible-section moves-section" [class.collapsed]="!movesExpanded()">
        <move-list
          [moves]="moves()"
          [moveClocks]="moveClocks()"
          [currentMoveIndex]="currentMoveIndex()"
          [highlightLastMove]="highlightLastMove()"
          [(expanded)]="movesExpanded"
          (jumpToMove)="jumpToMove($event)"
        />
      </div>

      <!-- Replay Panel -->
      <replay-panel
        [(replayMode)]="replayMode"
        [(proportionalDuration)]="proportionalDuration"
        [(minSecondsBetweenMoves)]="minSecondsBetweenMoves"
        [(fixedTime)]="fixedTime"
        [(fastTime)]="fastTime"
        [(stopOnError)]="stopOnError"
        [(stopOnErrorThreshold)]="stopOnErrorThreshold"
        [(stopOnErrorSide)]="stopOnErrorSide"
        [isReplaying]="isReplaying()"
        [canContinueReplay]="canContinueReplay()"
        [canShowReplayAll]="canShowReplayAll()"
        [selectedGamesCount]="selectedGamesCount()"
        (replayGame)="replayGame()"
        (continueReplay)="continueReplay()"
        (stopSequence)="stopSequence()"
        (replayAllSelectedGames)="replayAllSelectedGames()"
      />

      <!-- Load & Cache Panel -->
      <load-cache-panel
        [isLoading]="isLoading()"
        [loadingProgress]="loadingProgress()"
        [loadingStatus]="loadingStatus()"
        [cacheInfo]="cacheInfo()"
        [(pgnInput)]="pgnInput"
        [(urlInput)]="urlInput"
        [(indexStartPositions)]="indexStartPositions"
        [(maxFenPlies)]="maxFenPlies"
        [(lichessYear)]="lichessYear"
        [(lichessMonth)]="lichessMonth"
        (loadPgnString)="loadPgnString($event)"
        (clearPgnCache)="clearPgnCache()"
        (refreshCacheInfo)="refreshCacheInfo()"
        (loadFromLichess)="loadFromLichess()"
        (loadFromUrl)="loadFromUrl()"
        (loadFromClipboardEvent)="loadFromClipboard()"
        (copyToClipboardEvent)="copyToClipboard()"
      />
    </div>
  </div>
</div>
