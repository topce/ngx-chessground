<h3
  class="section-header"
  tabindex="0"
  role="button"
  [attr.aria-expanded]="expanded()"
  [attr.aria-controls]="'moves-section-content'"
  (click)="toggleExpanded()"
  (keydown.enter)="toggleExpanded(); $event.preventDefault()"
  (keydown.space)="toggleExpanded(); $event.preventDefault()"
>
  <span class="chevron" [class.expanded]="expanded()">▶</span>
  Moves
</h3>

<div class="section-content" [class.expanded]="expanded()" id="moves-section-content">
  <div class="move-list" #moveList>
    @for (move of moves(); track $index) {
      @if (isWhiteMove($index)) {
        <span class="move-number">{{ moveNumber($index) }}.</span>
      }
      <button type="button" 
        class="move-btn"
        [class.active]="$index === currentMoveIndex()"
        [class.last-move]="highlightLastMove() && $index === moves().length - 1"
        (click)="jumpToMove.emit($index)"
        [attr.aria-label]="
          'Jump to move ' +
          moveNumber($index) +
          (isWhiteMove($index) ? ' White ' : ' Black ') +
          move
        "
      >
        {{ move }}
      </button>
      @if ($index < moveClocks().length && moveClocks()[$index]) {
        <span class="move-clock">{{ moveClocks()[$index] }}</span>
      }
    }
  </div>
</div>
