<!-- Mini Player Bar -->
<div class="mini-bar" (click)="openOverlay()">
  <div class="mini-art">
    <span class="mini-note">♪</span>
  </div>

  <div class="mini-info">
    <span class="mini-title">{{ currentTrack().title }}</span>
    <span class="mini-artist">{{ currentTrack().artist }}</span>
  </div>

  <div class="mini-controls">
    <button class="mini-ctrl" (click)="prev($event)" aria-label="Previous">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5"/>
      </svg>
    </button>

    <button *ngIf="!isPlaying()" class="mini-ctrl mini-play" (click)="play(); $event.stopPropagation()" aria-label="Play">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
        <polygon points="8,5 19,12 8,19"/>
      </svg>
    </button>

    <button *ngIf="isPlaying()" class="mini-ctrl mini-stop" (click)="pause(); $event.stopPropagation()" aria-label="Stop">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
        <rect x="6" y="4" width="4" height="16"/>
        <rect x="14" y="4" width="4" height="16"/>
      </svg>
    </button>

    <button class="mini-ctrl" (click)="next($event)" aria-label="Next">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/>
      </svg>
    </button>
  </div>
</div>

<!-- Full Player Overlay -->
<div class="overlay-backdrop" *ngIf="isOverlayOpen()" (click)="closeOverlay()">
  <div class="overlay-card" (click)="$event.stopPropagation()">

    <!-- Drag handle & close -->
    <div class="overlay-top">
      <div class="drag-bar"></div>
      <button class="close-btn" (click)="closeOverlay()" aria-label="Close">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>

    <!-- Now Playing label -->
    <div class="np-label">
      <span class="np-dot"></span>
      Now Playing
    </div>

    <!-- Album Art -->
    <div class="art-large">
      <span class="art-large-note">♪</span>
      <div class="art-large-glow" [class.playing]="isPlaying()"></div>
    </div>

    <!-- Track Info -->
    <div class="track-info">
      <h2 class="track-title">{{ currentTrack().title }}</h2>
      <p class="track-artist">{{ currentTrack().artist }}</p>
    </div>

    <!-- Progress -->
    <div class="progress-section">
      <div class="progress-bar" (click)="seek($event)">
        <div class="progress-fill" [style.width.%]="progress()"></div>
        <div class="progress-thumb" [style.left.%]="progress()"></div>
      </div>
      <div class="time-row">
        <span class="time">{{ formattedCurrent() }}</span>
        <span class="time">{{ formattedDuration() }}</span>
      </div>
    </div>

    <!-- Main Controls -->
    <div class="controls-row">
      <button class="ctrl-btn" (click)="prev($event)" aria-label="Previous">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5"/>
        </svg>
      </button>

      <button class="play-btn" (click)="togglePlay(); $event.stopPropagation()" aria-label="Play / Pause">
        <svg *ngIf="isPlaying(); else playIcon" width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
          <rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>
        </svg>
        <ng-template #playIcon>
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
            <polygon points="8,5 19,12 8,19"/>
          </svg>
        </ng-template>
      </button>

      <button class="ctrl-btn" (click)="next($event)" aria-label="Next">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/>
        </svg>
      </button>
    </div>

    <!-- Secondary Controls -->
    <div class="secondary-row">
      <button class="toggle-btn" [class.active]="isShuffled()" (click)="toggleShuffle()" aria-label="Shuffle">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/>
          <polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/>
        </svg>
        <span>Shuffle</span>
      </button>

      <button class="toggle-btn" [class.active]="playAll()" (click)="togglePlayAll()" aria-label="Play All">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
          <rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>
        </svg>
        <span>Play All</span>
      </button>

      <span class="track-count">{{ currentIndex() + 1 }} / {{ playlist.length }}</span>
    </div>

    <!-- Links -->
    <div class="overlay-links">
      <a [href]="playlistUrl" target="_blank" rel="noopener" class="link">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        Full Playlist
      </a>
      <a [href]="musicPageUrl" target="_blank" rel="noopener" class="link">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
        Gambit Music
      </a>
    </div>
  </div>
</div>
