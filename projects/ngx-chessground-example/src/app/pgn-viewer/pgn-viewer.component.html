<div class="pgn-viewer-page">

  <!-- Header section -->
  <header class="viewer-header">
    <div class="header-content">
      <div class="header-left">
        <h1 class="viewer-title">PGN Viewer</h1>
        <p class="viewer-subtitle">Explore annotated chess games with interactive analysis</p>
      </div>
      <div class="header-right">
        <div class="game-selector">
          <span class="selector-label">Load Game</span>
          <div class="selector-buttons">
            <button class="game-btn fischer" (click)="loadFischer()" [class.active]="currentPgn === fischerEvergreen">
              <span class="btn-icon">♔</span>
              <span class="btn-text">Fischer</span>
              <span class="btn-sub">Evergreen</span>
            </button>
            <button class="game-btn topce" (click)="loadTopce()" [class.active]="currentPgn === topceEvergreen">
              <span class="btn-icon">♚</span>
              <span class="btn-text">Topce</span>
              <span class="btn-sub">Blitz</span>
            </button>
          </div>
        </div>
      </div>
    </div>
    <div class="header-actions">
      <button class="action-btn flip-btn" (click)="flipped = !flipped">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>
        </svg>
        Flip Board
      </button>
      <button class="action-btn sponsor-btn" (click)="openSponsor()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
        </svg>
        Sponsor
      </button>
    </div>
  </header>

  <!-- PGN Viewer -->
  <div class="viewer-body">
    <ngx-pgn-viewer [pgn]="currentPgn" [flipped]="flipped"></ngx-pgn-viewer>
  </div>
</div>
